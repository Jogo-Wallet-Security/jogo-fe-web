name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run Biome format check
        run: pnpm format:check

      - name: Build application
        run: pnpm build

      - name: Create Cloudflare Pages project if needed
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create jogo-fe-landing --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name="${{ github.event.repository.name }}"
            --branch="pr-${{ github.event.pull_request.number }}"
            --commit-hash="${{ github.sha }}"

      - name: Resolve preview URL
        id: resolve-url
        run: |
          alias="${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          direct="${{ steps.deploy.outputs.deployment-url }}"
          url="${alias:-$direct}"
          if [ -z "$url" ]; then
            echo "No URL from wrangler-action"; exit 1
          fi
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚀 Preview Deployment
            **Status**: ✅ Successfully deployed
            **Preview URL**: ${{ steps.resolve-url.outputs.preview_url }}
            **Branch**: `pr-${{ github.event.pull_request.number }}`
            **Commit**: `${{ github.sha }}`

            > Auto-updates on new commits.

            ---
            **Run Info:** [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Comment PR on deployment failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🚀 Preview Deployment
            **Status**: ❌ Deployment failed
            **Branch**: `pr-${{ github.event.pull_request.number }}`
            **Commit**: `${{ github.sha }}`

            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR cleanup
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚀 Preview Deployment
            **Status**: 🧹 Preview removed (PR closed)
